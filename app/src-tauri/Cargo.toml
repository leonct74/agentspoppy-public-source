[package]
name = "agentspoppy"
version = "0.1.0"
description = "AgentsPoppy — the open permission broker for your own AWS."
edition = "2021"
rust-version = "1.77"

# The library is what the mobile entry point links against; the binary just calls run().
[lib]
name = "agentspoppy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
