<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/agentspoppy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentsPoppy</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Browser-harness affordance: point the app at a non-default broker port with
      // ?broker=http://127.0.0.1:<port> (e.g. reviewing against a seeded demo broker
      // while the real desktop app keeps 8799). Loopback-only, and never in the
      // desktop shell — there the host injects the broker URL itself.
      if (!("__TAURI_INTERNALS__" in window)) {
        var __broker = new URLSearchParams(location.search).get("broker");
        // Shorthand ?broker=8798 means the loopback port; full form stays accepted.
        if (__broker && /^\d+$/.test(__broker)) __broker = "http://127.0.0.1:" + __broker;
        var __ok = function (u) { return typeof u === "string" && /^http:\/\/127\.0\.0\.1:\d+$/.test(u); };
        // Persist the override: the harness tab can be recreated at the bare origin
        // (dev-pane restores drop the query), and losing it silently re-points the app
        // at the default port — every call then dies as "helper isn't responding".
        try {
          if (__ok(__broker)) localStorage.setItem("agentspoppy:dev-broker", __broker);
          var __stored = __ok(__broker) ? __broker : localStorage.getItem("agentspoppy:dev-broker");
          if (__ok(__stored)) window.__AGENTSPOPPY_BROKER__ = __stored;
        } catch (e) {}
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
