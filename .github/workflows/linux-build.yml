# Linux port, step 1: prove the container + broker compile and RUN on
# linux-x64, and produce an AppImage — the same CI-as-build-machine pattern
# as windows-build.yml (no Linux hardware locally).
#
# Same non-negotiable lesson (macOS v0.2.0): a build that compiles is not a
# build that works — the broker smoke test below is the gate that matters.
# The AppImage is built WITH the updater signature so Linux installs get the
# in-app "Update & restart" banner from day one (there's no Linux app store
# channel doing it for us).
name: linux-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # draft-release upload below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Tauri Linux system dependencies (WebKitGTK et al.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install workspace dependencies
        run: npm ci

      # The broker's unit suite on REAL Linux — including the update-swap and
      # process-stop tests, so platform differences in rename/kill semantics
      # (the class of the 2026-08-22 Windows EBUSY field bug) are exercised
      # here rather than assumed from macOS runs. (windows-build can't run the
      # suite yet: several fixtures spawn .sh scripts — Windows-compatible
      # fixtures are a follow-up.)
      - name: Broker unit tests
        run: npm test -w @agentspoppy/broker

      # The REAL Secret Service round trip (docs/specs/operator-key-custody.md): unit
      # tests pin the logic with injected vaults; only a live keyring proves the actual
      # mechanism. gnome-keyring needs a dbus session and an unlocked daemon on a
      # headless runner.
      # A fresh headless runner has NO keyring collection, and creating one prompts via
      # the (displayless) gcr-prompter — so seed a plaintext, lockless default keyring
      # on disk first. The daemon loads it already unlocked; no prompt, no password.
      - name: vault smoke (Secret Service)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11
          mkdir -p ~/.local/share/keyrings
          printf 'Default_keyring' > ~/.local/share/keyrings/default
          printf '[keyring]\ndisplay-name=Default keyring\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' > ~/.local/share/keyrings/Default_keyring.keyring
          cat > /tmp/vault-smoke-inner.sh <<'EOF'
          #!/bin/bash
          set -e
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          npx tsx scripts/vault-smoke.mjs
          EOF
          chmod +x /tmp/vault-smoke-inner.sh
          dbus-run-session -- /tmp/vault-smoke-inner.sh
        env:
          AP_VAULT_DEBUG: "1"

      - name: Build broker (linux-x64 Node SEA)
        run: npm run build:broker -w @agentspoppy/app

      - name: Smoke-test the broker binary (must start and answer HTTP)
        run: |
          BROKER=app/src-tauri/binaries/agentspoppy-broker-x86_64-unknown-linux-gnu
          ls -la app/src-tauri/binaries/
          AGENTSPOPPY_PORT=8977 "$BROKER" > broker-smoke.log 2>&1 &
          BPID=$!
          sleep 5
          if ! kill -0 $BPID 2>/dev/null; then
            echo "❌ broker died during startup"; cat broker-smoke.log; exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8977/accounts || echo "000")
          echo "broker HTTP status: $CODE (401 = alive + auth working)"
          cat broker-smoke.log
          kill $BPID 2>/dev/null || true
          [ "$CODE" != "000" ] || { echo "❌ broker never answered HTTP"; exit 1; }

      - name: Build frontend
        run: npm run build -w @agentspoppy/app

      # Tauri's AppImage bundler does not use the distro's linuxdeploy: it downloads one
      # that Tauri mirrors itself, and that mirrored asset was uploaded 2024-07-29.
      # linuxdeploy compiles the AppImage excludelist INTO the binary at build time
      # (src/core/generate-excludelist.sh -> excludelist.h), and libwayland-client.so.0
      # only landed on that list 2024-11-03, in AppImageCommunity/pkg2appimage#559 —
      # three months after Tauri's pin was cut. So the pinned tool has never heard of the
      # exclusion and bundles Ubuntu 22.04's libwayland-{client,cursor,egl,server}.
      #
      # AppRun.wrapped (stock AppImageKit) then hard-codes the AppDir's lib dirs ahead of
      # the system ones in LD_LIBRARY_PATH, so on any host with wayland >= 1.24 the HOST's
      # libEGL_mesa.so.0 resolves against our stale copy, fails on the missing
      # wl_fixes_interface, and glvnd ends up with no EGL vendor at all: WebKitWebProcess
      # aborts with "Could not create default EGL display: EGL_BAD_PARAMETER" ~300ms into
      # startup. The main process survives, so the user gets a blank window and reads it as
      # a hang rather than a crash — which is why this went unreported for so long.
      # Field report: 0.3.18 on Arch/Omarchy, wayland 1.26 + mesa 26.2, 2026-09-04,
      # reproduced 6/6. Removing the four files on that host fixed it outright: Mesa's
      # libEGL_mesa + libgallium then map correctly and the app stays up.
      #
      # Two ways to fix it. Seeding a NEWER linuxdeploy would drop libwayland-client via
      # the current excludelist, but it means a two-year version jump in the bundler and
      # still leaves cursor/egl/server behind (they are not on the excludelist). Removing
      # the files ourselves keeps Tauri's pinned toolchain byte-for-byte and matches the
      # state actually verified on the affected hardware, so that is what we do.
      #
      # TRADEOFF, deliberate: dropping bundled libraries widens what we need from the
      # host, and the requirement is "host provides the wayland client libraries" — all
      # three of client, cursor and egl, not just client. The bundled libgdk-3 and
      # libgstgl need wl_cursor_theme_* / wl_cursor_image_get_buffer from libwayland-cursor
      # and wl_egl_window_create/_destroy/_resize from libwayland-egl. In practice the
      # wayland package ships all three together, so this is not a new axis of risk.
      #
      # The floor is wayland >= 1.20. libwayland-client carries no symbol versioning
      # (no version definition sections at all), so nothing protects the boundary, and
      # wl_proxy_marshal_flags — first exported in 1.20.0, per Debian's own
      # libwayland-client0.symbols — is an undefined symbol in SIX bundled objects:
      # libgdk-3, libwebkit2gtk-4.1, libgstgl-1.0, libwayland-cursor, im-wayland.so and
      # im-waylandgtk.so. So the floor applies across the whole GTK/WebKit surface; there
      # is no reading where only unused bits need it. A host below 1.20 (20.04 and
      # bullseye ship 1.18) would fail to load libgdk-3 at all — on X11 too, since
      # DT_NEEDED is resolved regardless of GDK_BACKEND.
      #
      # That is the same call upstream made in pkg2appimage#559: it trades a
      # broken-on-every-modern-host bug for a raised floor on hosts already past end of
      # standard support. Verified on wayland 1.26 (every undefined wayland symbol across
      # all six dependents resolves against the host). NOT verified downward — we have no
      # pre-1.20 host. Do not describe that direction as tested.
      #
      # prepare_tools() only downloads what is missing, so seeding this wrapper claims the
      # gtk plugin slot without forking the plugin itself. Deleting from the plugin is
      # final: linuxdeploy deploys no further libraries once input plugins have run — only
      # icons and desktop files, then the output plugin packs (linuxdeploy src/main.cpp).
      - name: Drop bundled libwayland (breaks host Mesa EGL on wayland >= 1.24)
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          # Tauri's own plugin, from the URL prepare_tools() would have used — fetched
          # rather than vendored so it keeps tracking upstream. The name deliberately
          # does not match linuxdeploy-plugin-*.sh, so it is not itself discoverable.
          curl -fsSL --retry 3 -o "$TOOLS/gtk-plugin-upstream.sh" \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x "$TOOLS/gtk-plugin-upstream.sh"
          cat > "$TOOLS/linuxdeploy-plugin-gtk.sh" <<'WRAPPER'
          #!/usr/bin/env bash
          set -e
          here="$(dirname "$(readlink -f "$0")")"
          "$here/gtk-plugin-upstream.sh" "$@"
          appdir=""
          while [ $# -gt 0 ]; do
            case "$1" in
              --appdir=*) appdir="${1#--appdir=}" ;;
              --appdir) appdir="${2:-}"; shift ;;
            esac
            shift
          done
          # No --appdir: linuxdeploy is only querying the plugin API version.
          if [ -n "$appdir" ] && [ -d "$appdir" ]; then
            find "$appdir" -name 'libwayland-*' -print -delete
          fi
          WRAPPER
          chmod +x "$TOOLS/linuxdeploy-plugin-gtk.sh"

      # The deb is not a Debian/Ubuntu channel decision — it is the SOURCE for the AUR
      # package (Tauri's own AUR guidance packages the deb, not the AppImage). It costs
      # nothing: the AppImage bundler already builds an appimage_deb tree on the way, so
      # asking for both is one extra bundle target on the same run.
      #
      # It also sidesteps this file's whole libwayland problem by construction: a deb
      # bundles no libraries at all, it declares webkit2gtk-4.1/gtk3/glib2 as system
      # dependencies, so a packaged install uses the host's graphics stack and cannot
      # shadow it. That is why the guard above only inspects the AppImage.
      - name: Tauri build (AppImage + signed updater artifact)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -w @agentspoppy/app -- build --bundles appimage,deb

      # The assertion that matters. Everything above is a means to this end, and if a
      # future linuxdeploy/Tauri change reintroduces the bundled wayland we want a red
      # build, not another silent blank-window release in the field.
      - name: Guard — the AppImage must not bundle libwayland
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUILT=(app/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#BUILT[@]} -ne 1 ]; then
            echo "::error::expected exactly one AppImage, found ${#BUILT[@]}"
            exit 1
          fi
          APPIMAGE="${BUILT[0]}"
          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/app.AppImage"
          chmod +x "$WORK/app.AppImage"
          ( cd "$WORK" && ./app.AppImage --appimage-extract > /dev/null )
          FOUND=$(find "$WORK/squashfs-root" -name 'libwayland-*' -printf '%P\n')
          if [ -n "$FOUND" ]; then
            echo "::error::AppImage bundles libwayland; this breaks host Mesa EGL on wayland >= 1.24 hosts"
            echo "$FOUND"
            exit 1
          fi
          echo "no libwayland in the bundle"
          # Not fatal, but the same shadowing failure mode applies to anything else the
          # host graphics stack links against, so surface it while we are already looking.
          find "$WORK/squashfs-root" \
            \( -name 'libEGL*' -o -name 'libGL*' -o -name 'libgbm*' -o -name 'libdrm*' -o -name 'libglapi*' \) \
            -printf 'note: also bundled: %P\n'
          rm -rf "$WORK"

      # A rolling DRAFT release in this (private) repo, not an Actions artifact: the
      # 114 MB AppImage alone dominated the account-wide 500 MB artifact ceiling, and
      # on 2026-08-22 it blocked both v0.3.4 release builds with ZERO live artifacts —
      # deleted ones still count until GitHub's 6-12h usage recalculation. Release
      # assets cost no Actions storage. Drafts are invisible outside the repo; this is
      # pure transport, downloaded with an authenticated gh and published permanently
      # to the public agentspoppy-releases repo as before.
      - name: Upload AppImage to the ci-linux-build draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-linux-build"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft \
            --title "CI transport: linux run ${{ github.run_id }}" \
            --notes "linux-x64 AppImage build of ${{ github.sha }}. Pure transport, not a release." \
            app/src-tauri/target/release/bundle/appimage/*.AppImage \
            app/src-tauri/target/release/bundle/appimage/*.sig \
            app/src-tauri/target/release/bundle/deb/*.deb
